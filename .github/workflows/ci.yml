name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          f = pathlib.Path('coverage/coverage-summary.json')
          if not f.exists():
              print('No coverage summary produced.')
              raise SystemExit
          t = json.load(f.open())['total']
          print('## Unit test coverage (threshold 90%)')
          print()
          print('| Metric | Covered | Total | % |')
          print('|---|---|---|---|')
          for k in ('lines', 'statements', 'functions', 'branches'):
              m = t[k]
              print(f"| {k} | {m['covered']} | {m['total']} | {m['pct']}% |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 14
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
        env:
          NUXT_PUBLIC_SITE_URL: http://localhost:3457
      - run: bun run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
